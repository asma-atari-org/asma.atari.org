name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout WUDSN-Base
        uses: actions/checkout@v4
        with:
          repository: wudsn/wudsn-base
          path: wudsn-base
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install WUDSN-Base into the local Maven repo
        run: mvn -B -ntp install
        working-directory: wudsn-base
      - name: Build and test
        run: mvn -B clean verify
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            asma-tools/target/SAPFileEditor.jar
            asma-tools/target/SAPFileEditor.zip
          generate_release_notes: true
