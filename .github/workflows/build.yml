name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout WUDSN-Base
        uses: actions/checkout@v4
        with:
          repository: wudsn/wudsn-base
          path: wudsn-base
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install WUDSN-Base into the local Maven repo
        run: mvn -B -ntp install
        working-directory: wudsn-base
      - name: Build and test
        run: mvn -B clean verify

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run JavaScript tests
        run: node --test "js-test/*.test.js"
      - name: Check asma.js module syntax
        run: node --input-type=module --check < public_html/asmadb/asma.js
